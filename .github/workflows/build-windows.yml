name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Windows/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish WPF App
      run: |
        cd Windows/SibeliusReset
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o ../publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sibelius重置-Windows
        path: Windows/publish/Sibelius重置.exe
        compression-level: 0

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: windows-latest
        name: 🚀 Sibelius 重置工具 Windows 版
        body: |
          下载 `Sibelius重置.exe` 后双击运行即可，无需安装任何依赖。
          运行时会自动弹出管理员权限提示（UAC），请点击"是"。
        files: Windows/publish/Sibelius重置.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
