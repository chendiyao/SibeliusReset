name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Windows/**'
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 允许创建 Release

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish WPF App
      run: |
        cd Windows/SibeliusReset
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o ../publish

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sibelius重置-Windows
        path: Windows/publish/Sibelius重置.exe
        compression-level: 0 # 已经是压缩的单文件，无需额外压缩

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: windows-latest
        name: 🚀 Windows 最新版本
        body: "自动打包的最新 Windows 客户端。下载 `Sibelius重置.exe` 后双击运行即可。"
        files: Windows/publish/Sibelius重置.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
