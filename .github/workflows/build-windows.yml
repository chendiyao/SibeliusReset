name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Windows/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish x64 (Intel/AMD)
      run: |
        cd Windows/SibeliusReset
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o ../publish/x64
        ren ..\publish\x64\Sibelius重置.exe Sibelius重置-x64.exe

    - name: Publish arm64 (Mac M1/M2/M3 VM)
      run: |
        cd Windows/SibeliusReset
        dotnet publish -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o ../publish/arm64
        ren ..\publish\arm64\Sibelius重置.exe Sibelius重置-arm64.exe

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: windows-latest
        name: 🚀 Sibelius 重置工具 Windows 版
        body: |
          下载对应的版本后双击运行即可，无需安装任何依赖。
          - **Intel/AMD 电脑**：下载 `Sibelius重置-x64.exe`
          - **Mac (M系列芯片) 的 Windows 虚拟机**：下载 `Sibelius重置-arm64.exe`
          
          运行会自动弹出管理员权限提示，请点击"是"。
        files: |
          Windows/publish/x64/Sibelius重置-x64.exe
          Windows/publish/arm64/Sibelius重置-arm64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
